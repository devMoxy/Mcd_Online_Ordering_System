spring:
  application:
    name: mcdonalds-clone

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcdonalds_clone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
