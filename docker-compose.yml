services:
  postgres:
    image: postgres:16-alpine
    container_name: mcdonalds-clone-db
    environment:
      POSTGRES_DB: mcdonalds_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
